<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Agente de ventas</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 19V10M10 19V5M16 19v-6M22 19H2" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>Agente de ventas</strong>
          <small>SQLite · 697.894 filas</small>
        </span>
      </div>
      <button class="icon-btn" id="toggle-sidebar" title="Ocultar panel" aria-label="Ocultar panel">«</button>
    </div>

    <button class="new-chat" id="new-chat">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Nueva conversación
    </button>

    <div class="sidebar-section">Conversaciones</div>
    <nav class="session-list" id="session-list" aria-label="Conversaciones"></nav>

    <div class="sidebar-foot">
      <div class="status-line">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Conectando…</span>
      </div>
      <div class="model-line" id="model-line"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="open-sidebar" title="Mostrar panel" aria-label="Mostrar panel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <div class="topbar-title" id="topbar-title">Nueva conversación</div>
      <div class="topbar-right">
        <span class="model-badge" id="model-badge" title="Modelo en uso"></span>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18" />
            <path d="M7 16l4-6 3.5 3.5L21 7" />
          </svg>
        </div>
        <h1>Pregunta lo que quieras sobre las ventas</h1>
        <p>El agente consulta la base SQLite en vivo y responde en español, con las cifras ya calculadas.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="¿Cuál es el top 5 de tiendas por ventas totales?">
            <span class="s-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z" />
                <path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" />
              </svg>
            </span>
            <span class="s-text"><strong>Top 5 tiendas</strong><small>por ventas totales</small></span>
          </button>
          <button class="suggestion" data-prompt="¿Cómo evolucionan las ventas mes a mes en 2021?">
            <span class="s-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 17l6-6 4 4 8-8" />
                <path d="M14 7h7v7" />
              </svg>
            </span>
            <span class="s-text"><strong>Evolución mensual</strong><small>ventas de 2021</small></span>
          </button>
          <button class="suggestion" data-prompt="¿Qué porcentaje de las ventas se hace con promoción?">
            <span class="s-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z" />
                <circle cx="7" cy="7" r="1.4" />
              </svg>
            </span>
            <span class="s-text"><strong>Impacto de promociones</strong><small>peso en las ventas</small></span>
          </button>
          <button class="suggestion" data-prompt="¿Qué clases de producto venden más unidades?">
            <span class="s-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8 12 3 3 8v8l9 5 9-5V8z" />
                <path d="M3 8l9 5 9-5M12 13v8" />
              </svg>
            </span>
            <span class="s-text"><strong>Clases de producto</strong><small>unidades vendidas</small></span>
          </button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <form class="composer" id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Escribe tu pregunta…"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="send" class="send-btn" title="Enviar" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6l.1 6.5L15 12 3.5 13.9z" />
        </svg>
      </button>
      <button type="button" id="stop" class="send-btn stop hidden" title="Detener" aria-label="Detener">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" fill="currentColor" rx="2.5" />
        </svg>
      </button>
    </form>
    <div class="composer-hint">Enter para enviar · Shift + Enter para salto de línea</div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
